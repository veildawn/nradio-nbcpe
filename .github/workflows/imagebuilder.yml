name: OpenWrt ImageBuilder (NRadio NBCPE)

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Space-separated OpenWrt packages to preinstall"
        required: false
        default: "luci luci-ssl luci-proto-ncm luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn iw-full usbutils picocom"
      publish_release:
        description: "Publish built sysupgrade.bin as a GitHub Release"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint board scripts and Python tooling
        run: |
          python3 -m py_compile board/apply.py board/inject_imagebuilder.py board/platform_upgrade.py
          find board/files/etc/board.d board/files/etc/init.d board/files/etc/hotplug.d board/files/etc/uci-defaults board/files/usr/sbin board/files/lib/functions board/files/lib/preinit -type f -print0 | xargs -0 -n 1 sh -n
          for script in board/files/www/luci-static/resources/view/nradio/*.js; do
            node --check "$script"
          done
          python3 - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path('board/files').rglob('*.json')):
              json.loads(p.read_text())
              print('json ok:', p)
          PY

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/imagebuilder.yml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Test updater, modem snapshots and LuCI interactions
        run: |
          python3 -m pip install 'playwright>=1.50,<2'
          python3 -m playwright install --with-deps chromium
          python3 -m unittest discover -s tests -v

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler file gawk libncurses-dev python3 qemu-user-static rsync unzip util-linux wget xz-utils zstd

      - name: Read ImageBuilder snapshot revision
        id: ibver
        run: |
          mkdir -p /tmp/ib/extracted /tmp/ib/release
          curl -fsSL https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/version.buildinfo \
            -o /tmp/ib/version.buildinfo
          echo "rev=$(tr -d ' \r\n' < /tmp/ib/version.buildinfo)" >> "$GITHUB_OUTPUT"

      - name: Cache ImageBuilder archive
        id: ibcache
        uses: actions/cache@v4
        with:
          path: /tmp/ib/ib.tar.zst
          key: ib-mediatek-filogic-${{ steps.ibver.outputs.rev }}

      - name: Download official OpenWrt Snapshot Filogic ImageBuilder
        if: steps.ibcache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/ib/ib.tar.zst \
            https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst

      - name: Extract ImageBuilder
        run: |
          tar --use-compress-program=unzstd -xf /tmp/ib/ib.tar.zst -C /tmp/ib/extracted --strip-components=1

      - name: Inject NRadio NBCPE board support
        run: |
          python3 -B board/inject_imagebuilder.py /tmp/ib/extracted

      - name: Record the project release in the firmware
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            REV="$(tr -d ' \r\n' < /tmp/ib/version.buildinfo)"
            TAG="openwrt-${REV}-$(date -u +%Y%m%d%H%M)"
          fi
          RELEASE_FILE=/tmp/ib/extracted/files-nbcpe/usr/share/nradio-nbcpe/release
          install -d "$(dirname "$RELEASE_FILE")"
          printf '%s\n' "$TAG" > "$RELEASE_FILE"
          printf 'NRADIO_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

      - name: Pack custom sysupgrade.bin
        run: |
          EXTRA_PKGS="${{ inputs.extra_packages }}"
          if [ -z "$EXTRA_PKGS" ]; then
            EXTRA_PKGS="luci luci-ssl luci-proto-ncm luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn iw-full usbutils picocom"
          fi
          umask 022
          make -C /tmp/ib/extracted image \
            PROFILE="nradio_nbcpe" \
            PACKAGES="kmod-usb-net-cdc-ether ${EXTRA_PKGS}" \
            FILES="files-nbcpe"

      - name: Verify sysupgrade metadata and stage artifacts
        run: |
          BIN="/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_nbcpe-squashfs-sysupgrade.bin"
          DTB=(/tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/image-mt7981-nradio-nbcpe.dtb)
          FACTORY_NVMEM="/soc/mmc@11230000/card@0/block/partitions/block-partition-factory"
          test "$(fdtget "${DTB[0]}" "$FACTORY_NVMEM" partname)" = factory
          fdtget "${DTB[0]}" "$FACTORY_NVMEM/nvmem-layout/eeprom@0" reg
          test "$(fdtget "${DTB[0]}" /chosen bootargs | tr ' ' '\n' | grep ^root=)" = "root=PARTLABEL=rootfs_2nd"
          /tmp/ib/extracted/staging_dir/host/bin/fwtool -i /tmp/ib/meta.json "$BIN"
          python3 - <<'PY'
          import json, struct, tarfile
          with open("/tmp/ib/meta.json") as f:
              meta = json.load(f)
          assert meta["compat_version"] == "1.0", meta
          assert set(meta["supported_devices"]) == {"nradio,nbcpe"}, meta["supported_devices"]
          with tarfile.open("/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_nbcpe-squashfs-sysupgrade.bin", "r") as tf:
              names = tf.getnames()
              assert any(n.endswith("/CONTROL") for n in names) and any(n.endswith("/kernel") for n in names) and any(n.endswith("/root") for n in names), names
              kernel = tf.extractfile("sysupgrade-nradio_nbcpe/kernel").read(8)
              assert kernel[:4] == b"\xd0\x0d\xfe\xed", "kernel member must be a FIT image for kernel_2nd"
              root = tf.getmember("sysupgrade-nradio_nbcpe/root")
              header = tf.extractfile(root).read(48)
              assert header[:4] == b"hsqs", "rootfs_2nd rootdisk requires SquashFS"
              bytes_used = struct.unpack_from("<Q", header, 40)[0]
              assert 0 < bytes_used <= root.size
              # fstools uses the superblock size, while both flashers use the tar member size.
              assert (bytes_used + 65535) // 65536 == (root.size + 65535) // 65536
          with open("/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_nbcpe.manifest") as mf:
              # APK manifests use "pkgname-version"; legacy OPKG used "pkgname - version".
              # The first whitespace token is the package name in both formats.
              pkgs = {line.split()[0] for line in mf if line.strip()}
          assert "kmod-tun" in pkgs, "Firmware is missing kmod-tun"
          assert "ucode-mod-socket" in pkgs, "Firmware is missing the Ethernet AT socket module"
          assert "blkid" in pkgs, "Firmware is missing blkid (preinit and factory ubenv require it)"
          assert "kmod-mt7915e" in pkgs and "kmod-mt7981-firmware" in pkgs, "Firmware is missing MT7981 Wi-Fi drivers"
          if "luci-i18n-base-zh-cn" in pkgs:
              for app in sorted(p for p in pkgs if p.startswith("luci-app-")):
                  i18n = f"luci-i18n-{app.removeprefix('luci-app-')}-zh-cn"
                  if i18n not in pkgs:
                      print(f"::warning::No Chinese translation package {i18n} for {app} (may not exist upstream for custom packages); skipping")
          PY
          if [[ -n "${NRADIO_RELEASE_TAG:-}" ]]; then
            tar -xOf "$BIN" sysupgrade-nradio_nbcpe/root > /tmp/ib/root.squashfs
            BUILT_TAG=$(/tmp/ib/extracted/staging_dir/host/bin/unsquashfs4 -cat \
              /tmp/ib/root.squashfs usr/share/nradio-nbcpe/release)
            test "$BUILT_TAG" = "$NRADIO_RELEASE_TAG"
            rm /tmp/ib/root.squashfs
          fi
          cp -f /tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_nbcpe* /tmp/ib/release/
          cp -f /tmp/ib/extracted/bin/targets/mediatek/filogic/profiles.json /tmp/ib/release/
          cp -f /tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/image-mt7981-nradio-nbcpe.dtb /tmp/ib/release/
          (
            cd /tmp/ib/release
            sha256sum \
              openwrt-mediatek-filogic-nradio_nbcpe-squashfs-sysupgrade.bin \
              openwrt-mediatek-filogic-nradio_nbcpe.manifest \
              openwrt-mediatek-filogic-nradio_nbcpe.bom.cdx.json \
              profiles.json \
              image-mt7981-nradio-nbcpe.dtb > sha256sums
          )
          ls -lh /tmp/ib/release
          cat /tmp/ib/release/sha256sums

      - name: Check executables in the finished root filesystem
        run: |
          BIN=/tmp/ib/release/openwrt-mediatek-filogic-nradio_nbcpe-squashfs-sysupgrade.bin
          tar -xOf "$BIN" sysupgrade-nradio_nbcpe/root > /tmp/ib/check.squashfs
          sudo /tmp/ib/extracted/staging_dir/host/bin/unsquashfs4 -d /tmp/ib/rootfs-check /tmp/ib/check.squashfs
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/ib/rootfs-check')
          blkid = root / 'usr/sbin/blkid'
          assert blkid.is_file() and blkid.stat().st_mode & 0o111, 'blkid executable missing'
          assert blkid.read_bytes()[:4] == b'\x7fELF', 'Expected the full util-linux blkid'
          for name in ('lib/preinit/35_nradio_emmc_overlay', 'usr/sbin/nbcpe-bootswitch', 'usr/bin/ubenv', 'usr/sbin/mt5700-ethernet', 'usr/sbin/mt5700-status', 'usr/sbin/mt5700-sim', 'usr/sbin/nbcpe-leds', 'usr/share/nradio-nbcpe/mt5700-ethernet.uc'):
              assert (root / name).read_bytes() == (Path('board/files') / name).read_bytes(), name
          assert (root / 'usr/bin/ubenv').stat().st_mode & 0o111
          assert (root / 'usr/sbin/nbcpe-bootswitch').stat().st_mode & 0o111
          PY
          sudo install -m 755 /usr/bin/qemu-aarch64-static /tmp/ib/rootfs-check/tmp/qemu-aarch64-static
          sudo chroot /tmp/ib/rootfs-check /tmp/qemu-aarch64-static /usr/sbin/blkid --version
          sudo chroot /tmp/ib/rootfs-check /tmp/qemu-aarch64-static /usr/bin/ucode -e 'import * as s from "socket"; if (type(s.create) != "function") exit(1); print("Ethernet AT socket module ready\n");'
          sudo chroot /tmp/ib/rootfs-check /tmp/qemu-aarch64-static /usr/bin/ucode -c -o /tmp/ethernet-test.uc /usr/share/nradio-nbcpe/mt5700-ethernet.uc

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nradio-nbcpe-${{ github.run_number }}
          path: /tmp/ib/release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="$(cat /tmp/ib/version.buildinfo | tr -d ' \r\n')"
          KVER="$(basename /tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/linux-* | sed 's/^linux-//')"
          TAG="$NRADIO_RELEASE_TAG"
          cat <<EOF > /tmp/ib/release_notes.md
          ## OpenWrt Official Snapshot (\`${REV}\` / Linux \`${KVER}\`) — NRadio NBCPE (WT9111)

          基于**官方 OpenWrt \`main\` Snapshot \`mediatek/filogic\` ImageBuilder** 自动构建，遵循社区开源主线标准（不使用任何闭源 Wi-Fi 驱动或第三方魔改内核分支）。

          ### 核心特性
          - **内核与在线软件源**：Linux \`${KVER}\`，内核 \`vermagic\` 与 \`downloads.openwrt.org\` 官方 \`mediatek/filogic\` Snapshot 完全一致，刷入后可直接执行 \`apk update && apk add <pkg>\` 在线安装官方全部 \`kmod-*\` 与软件包。
          - **Wi-Fi 6 (\`MT7981\` 双频 DBDC)**：主线开源 \`mt76\`（\`kmod-mt7915e\` + \`kmod-mt7981-firmware\`），EEPROM 校准数据只读挂载自 eMMC \`factory\` 分区，默认 \`country=CN\`。
          - **默认无线**：新安装启用 \`NRadio-NBCPE-2G\` 和 \`NRadio-NBCPE-5G\`，使用 WPA2/WPA3 混合加密，初始密码为 \`12345678\`。
          - **5G 蜂窝（MT5700M-CN 网口桥接）**：通过 TCP AT 接口采集注册、信号、小区、SIM 和温度，手动切换内置/外置 SIM；默认不进行 USB 重训练、冷断电恢复或 NVRAM 自动改写。
          - **中文管理页**：5G 蜂窝页区分网口连接、AT 采样与注册状态；双系统切换页提供启动目标校验；在线升级校验摘要和机型，并支持保留配置或清除第二系统配置。
          - **有线与系统**：3 个 LAN、1 个 PoE/5G 桥接上行口（GPY211B 2.5G PHY）；IPv4/IPv6 共用同一上行。原厂配置与第二系统配置分别保存在 p7 / p9，互不导入。4G/5G 灯按实际注册状态更新，Wi-Fi 灯按双频启用状态更新。

          ### 刷入、SSH 登录与双系统切换说明
          - **首次安装**：在原厂 Web（\`192.168.10.1\`）「Backup / Flash Firmware → Flash second system」上传本 \`sysupgrade.bin\`（未签名 \`ustar\` \`compat_version 1.0\`，写入 eMMC \`kernel_2nd\` + \`rootfs_2nd\`，原厂系统分区不受影响），烧录完成后点击 **Switch system** 切换到第二系统启动。
          - **默认管理地址**：\`http://192.168.1.1\`（首次登录 \`root\` 无密码，请立即设置密码）。净刷后 Dropbear 允许空密码 \`root\` SSH 首登；若提示密钥变更，先执行 \`ssh-keygen -R 192.168.1.1\`。
          - **双系统无损切回原厂**：在 LuCI「系统 → 双系统切换」一键切换（\`boot_system=0\`），或在 OpenWrt SSH 执行 \`nbcpe-bootswitch to-factory && reboot\`；原厂 Web 的 **Switch system** 可随时再切回 OpenWrt。
          - **在线升级**：同版本或跨内核版本均可通过「在线固件更新」完成（升级只作用于 eMMC 第二系统分区，原厂系统与 factory/bdinfo 校准数据永不触碰）。

          ### SHA-256 校验值
          \`\`\`text
          $(cat /tmp/ib/release/sha256sums)
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/ib/release/* --clobber
            gh release edit "$TAG" \
              --title "OpenWrt Snapshot ${REV} (Linux ${KVER}) for NRadio NBCPE (WT9111)" \
              --notes-file /tmp/ib/release_notes.md
          else
            gh release create "$TAG" /tmp/ib/release/* \
              --title "OpenWrt Snapshot ${REV} (Linux ${KVER}) for NRadio NBCPE (WT9111)" \
              --notes-file /tmp/ib/release_notes.md
          fi
